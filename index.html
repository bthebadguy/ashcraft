<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Ultimate Survival 3D</title>
  <style>
    :root {
      --bg: #0c1724;
      --panel: #142a3d;
      --panel-2: #1d3952;
      --primary: #27a0ff;
      --primary-dark: #1d6ca8;
      --good: #76d97e;
      --gold: #f7c75f;
      --danger: #ff5d73;
      --wood: #8a5d2d;
      --stone: #7c8798;
      --grass: #69a94c;
      --shadow: #09141d;
      --text: #eef7ff;
      --muted: #b8d0e8;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at top, #19324c 0%, #0c1724 35%, #09141d 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    #gameShell {
      width: min(100%, 1100px);
    }

    header {
      padding: 12px 16px 10px;
      text-align: center;
      background: rgba(18, 35, 52, 0.95);
      border: 1px solid rgba(255,255,255,0.07);
      border-bottom: none;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    }

    h1 {
      margin: 4px 0 2px;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: 0.08em;
    }

    .subtitle {
      color: var(--muted);
      letter-spacing: 0.05em;
      font-size: 13px;
      text-transform: uppercase;
    }

    #stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px 8px;
      background: rgba(21, 40, 59, 0.95);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
    }

    .stat {
      background: linear-gradient(180deg, #203d59, #18314a);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      min-width: 110px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    #gameWrap {
      position: relative;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
      background: rgba(15, 27, 39, 0.75);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--grass);
      touch-action: manipulation;
      image-rendering: auto;
      aspect-ratio: 3 / 2;
      border-top: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    #message {
      min-height: 58px;
      padding: 12px 14px;
      text-align: center;
      font-weight: bold;
      color: #ffe9a3;
      background: rgba(19, 33, 47, 0.95);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
      font-size: 15px;
      line-height: 1.4;
    }

    #inventory {
      min-height: 28px;
      padding: 8px 12px 12px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      background: rgba(19, 33, 47, 0.95);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 0;
      background: rgba(19, 33, 47, 0.95);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
    }

    .controls.compact {
      gap: 10px;
      padding-bottom: 2px;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, #2f597d, #234566);
      color: white;
      font-size: 14px;
      font-weight: bold;
      padding: 12px 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }

    button:hover { filter: brightness(1.04); }
    button:active {
      transform: translateY(1px) scale(0.99);
      filter: brightness(0.96);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px 8px 16px;
      background: rgba(19, 33, 47, 0.95);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.18);
    }

    .actions button {
      flex: 1 1 160px;
      max-width: 200px;
    }

    .small {
      font-size: 12px;
      text-align: center;
      color: var(--muted);
      padding: 8px 10px 0;
      background: rgba(19, 33, 47, 0.95);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-radius: 0 0 14px 14px;
    }

    @media (max-width: 640px) {
      body { padding: 8px; }
      .actions button {
        flex-basis: 140px;
        max-width: 170px;
      }
      .stat {
        min-width: 88px;
        font-size: 12px;
      }
      #message {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="gameShell">
    <header>
      <h1>🌎 ULTIMATE SURVIVAL 3D</h1>
      <div class="subtitle">Explore • Build • Fight • Collect Pets</div>
    </header>

    <div id="stats">
      <span class="stat" id="health">❤️ 100/100</span>
      <span class="stat" id="wood">🪵 20</span>
      <span class="stat" id="stone">🪨 10</span>
      <span class="stat" id="coins">🪙 0</span>
      <span class="stat" id="level">⭐ Level 1</span>
      <span class="stat" id="pets">🐾 0 pets</span>
    </div>

    <div id="gameWrap">
      <canvas id="game" width="900" height="600"></canvas>
    </div>

    <div id="message">Welcome! Explore the world and collect treasure.</div>
    <div id="inventory"></div>

    <div class="controls compact">
      <button onclick="move(0,-1)">⬆️</button>
    </div>
    <div class="controls">
      <button onclick="move(-1,0)">⬅️</button>
      <button onclick="move(0,1)">⬇️</button>
      <button onclick="move(1,0)">➡️</button>
    </div>

    <div class="actions">
      <button onclick="mine()">⛏️ Mine</button>
      <button onclick="build()">🧱 Build Wall</button>
      <button onclick="attack()">⚔️ Attack</button>
      <button onclick="openChest()">🎁 Loot</button>
      <button onclick="hatchPet()">🥚 Pet Egg (50)</button>
      <button onclick="heal()">❤️ Heal (20)</button>
      <button onclick="summonBoss()">👹 Boss</button>
      <button onclick="secretPortal()">🌀 Portal</button>
      <button onclick="saveGame()">💾 Save</button>
      <button onclick="loadGame()">📂 Load</button>
      <button onclick="restartGame()">🔄 Restart</button>
    </div>

    <div class="small">
      Tip: Walk next to trees, rocks, chests, and enemies before using actions. Keyboard: WASD or arrow keys.
    </div>
  </div>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const $ = id => document.getElementById(id);

    const rand = (min, max) => Math.random() * (max - min) + min;
    const randint = (min, max) => Math.floor(rand(min, max + 1));
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    let player, trees, rocks, chests, enemies, walls, loot, petList;
    let wood, stone, coins, hp, xp, level, damage, dead;
    let lastTime = 0;
    let spawnClock = 0;
    let gameTime = 0;
    let messageTimer = 0;

    function say(text) {
      $("message").textContent = text;
      messageTimer = 3;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function make(x, y, extra = {}) {
      return { x, y, ...extra };
    }

    function rarity() {
      const n = Math.random();
      if (n < 0.5) return "Common";
      if (n < 0.78) return "Rare";
      if (n < 0.95) return "Epic";
      return "Legendary";
    }

    function rarityColor(r) {
      return {
        Common: "#dedede",
        Rare: "#39c9ff",
        Epic: "#d46aff",
        Legendary: "#ffd43b"
      }[r] || "#fff";
    }

    function resetGame() {
      player = make(0, 0, { damage: 20, attackCooldown: 0 });
      trees = [];
      rocks = [];
      chests = [];
      enemies = [];
      walls = [];
      loot = [];
      petList = [];

      wood = 20;
      stone = 10;
      coins = 0;
      hp = 100;
      xp = 0;
      level = 1;
      damage = 20;
      dead = false;
      gameTime = 0;
      spawnClock = 0;

      for (let i = 0; i < 160; i++) {
        const x = randint(-45, 45);
        const y = randint(-45, 45);
        if (Math.hypot(x, y) < 4) continue;

        const n = Math.random();
        if (n < 0.48) trees.push(make(x, y, { hp: 3 }));
        else if (n < 0.76) rocks.push(make(x, y, { hp: 3 }));
        else if (n < 0.87) chests.push(make(x, y, { rarity: rarity() }));
      }

      for (let i = 0; i < 12; i++) spawnEnemy(false);
      chests.push(make(8, 8, { rarity: "Legendary" }));

      updateUI();
      say("Your adventure begins! Find the legendary chest.");
    }

    function worldToScreen(x, y) {
      return {
        x: W / 2 + (x - player.x - y + player.y) * 22,
        y: H / 2 + (x - player.x + y - player.y) * 11
      };
    }

    function diamond(x, y, color) {
      ctx.beginPath();
      ctx.moveTo(x, y - 11);
      ctx.lineTo(x + 22, y);
      ctx.lineTo(x, y + 11);
      ctx.lineTo(x - 22, y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawGround() {
      ctx.fillStyle = "#70ae50";
      ctx.fillRect(0, 0, W, H);

      for (let y = -35; y <= 35; y++) {
        for (let x = -35; x <= 35; x++) {
          const p = worldToScreen(x, y);
          if (p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30) continue;
          diamond(p.x, p.y, ((x + y) % 2 === 0) ? "#72b253" : "#6aa74c");
          if ((x * 7 + y * 13) % 31 === 0) {
            ctx.fillStyle = "#4d8c3b";
            ctx.fillRect(p.x - 2, p.y - 2, 3, 3);
          }
        }
      }
    }

    function drawTree(o) {
      const p = worldToScreen(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.15)";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 15, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#79502d";
      ctx.fillRect(p.x - 5, p.y - 27, 10, 28);

      ctx.fillStyle = "#125b32";
      ctx.beginPath();
      ctx.arc(p.x, p.y - 39, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#228545";
      ctx.beginPath();
      ctx.arc(p.x - 6, p.y - 48, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#329c4b";
      ctx.beginPath();
      ctx.arc(p.x + 7, p.y - 43, 11, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawRock(o) {
      const p = worldToScreen(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.15)";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 15, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#687785";
      ctx.beginPath();
      ctx.moveTo(p.x - 16, p.y - 2);
      ctx.lineTo(p.x - 12, p.y - 16);
      ctx.lineTo(p.x - 1, p.y - 25);
      ctx.lineTo(p.x + 12, p.y - 17);
      ctx.lineTo(p.x + 17, p.y - 4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#9ba9b5";
      ctx.beginPath();
      ctx.moveTo(p.x - 10, p.y - 15);
      ctx.lineTo(p.x - 1, p.y - 25);
      ctx.lineTo(p.x + 5, p.y - 17);
      ctx.lineTo(p.x - 3, p.y - 12);
      ctx.closePath();
      ctx.fill();
    }

    function drawChest(o) {
      const p = worldToScreen(o.x, o.y);
      ctx.fillStyle = "rgba(0,0,0,.15)";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 14, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = rarityColor(o.rarity);
      ctx.fillRect(p.x - 13, p.y - 17, 26, 15);
      ctx.fillStyle = "#75451f";
      ctx.fillRect(p.x - 13, p.y - 9, 26, 4);
      ctx.fillStyle = "#fff0a6";
      ctx.fillRect(p.x - 2, p.y - 10, 4, 6);
    }

    function drawWall(o) {
      const p = worldToScreen(o.x, o.y);
      ctx.fillStyle = "#805b38";
      ctx.fillRect(p.x - 13, p.y - 28, 26, 28);
      ctx.fillStyle = "#b68a5b";
      ctx.beginPath();
      ctx.moveTo(p.x - 13, p.y - 28);
      ctx.lineTo(p.x, p.y - 36);
      ctx.lineTo(p.x + 13, p.y - 28);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#5c3b24";
      ctx.strokeRect(p.x - 13, p.y - 28, 26, 28);
    }

    function drawEnemy(e) {
      const p = worldToScreen(e.x, e.y);
      const boss = e.type === "boss";
      const radius = boss ? 19 : 11;

      ctx.fillStyle = "rgba(0,0,0,.2)";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, radius + 3, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = boss ? "#7b27a8" : "#c9364c";
      ctx.beginPath();
      ctx.arc(p.x, p.y - 12, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff";
      ctx.fillRect(p.x - 6, p.y - 16, 4, 4);
      ctx.fillRect(p.x + 3, p.y - 16, 4, 4);
      ctx.fillStyle = "#222";
      ctx.fillRect(p.x - 5, p.y - 5, 10, 3);

      if (boss) {
        ctx.fillStyle = "#111";
        ctx.fillRect(p.x - 24, p.y - 42, 48, 6);
        ctx.fillStyle = "#ff435d";
        ctx.fillRect(p.x - 24, p.y - 42, 48 * Math.max(0, e.hp / e.maxHp), 6);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";
        ctx.fillText("SHADOW BOSS", p.x, p.y - 47);
      }
    }

    function drawLoot(o) {
      const p = worldToScreen(o.x, o.y);
      ctx.fillStyle = rarityColor(o.rarity);
      ctx.beginPath();
      ctx.arc(p.x, p.y - 8, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#222";
      ctx.font = "bold 10px Arial";
      ctx.textAlign = "center";
      ctx.fillText("★", p.x, p.y - 5);
    }

    function drawPlayer() {
      const x = W / 2;
      const y = H / 2;
      ctx.fillStyle = "rgba(0,0,0,.2)";
      ctx.beginPath();
      ctx.ellipse(x, y, 15, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#1686ee";
      ctx.beginPath();
      ctx.arc(x, y - 13, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(x - 4, y - 16, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + 4, y - 16, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#15395b";
      ctx.fillRect(x - 8, y - 3, 16, 5);
    }

    function drawPets() {
      petList.forEach((pet, i) => {
        const x = W / 2 - 35 - i * 25;
        const y = H / 2 + 10 + (i % 2) * 12;
        ctx.font = "22px Arial";
        ctx.textAlign = "center";
        ctx.fillText(pet.emoji, x, y);
      });
    }

    function drawHUD() {
      ctx.fillStyle = "rgba(10,20,30,.7)";
      ctx.fillRect(12, 12, 180, 52);
      ctx.fillStyle = "white";
      ctx.textAlign = "left";
      ctx.font = "bold 13px Arial";
      ctx.fillText("WORLD EXPLORER", 21, 31);
      ctx.font = "12px Arial";
      ctx.fillText("X " + Math.round(player.x) + "   Y " + Math.round(player.y), 21, 48);
    }

    function draw() {
      drawGround();

      const objects = [];
      trees.forEach(o => objects.push({ o, type: "tree" }));
      rocks.forEach(o => objects.push({ o, type: "rock" }));
      chests.forEach(o => objects.push({ o, type: "chest" }));
      walls.forEach(o => objects.push({ o, type: "wall" }));
      enemies.forEach(o => objects.push({ o, type: "enemy" }));
      loot.forEach(o => objects.push({ o, type: "loot" }));

      objects.sort((a, b) => (a.o.x + a.o.y) - (b.o.x + b.o.y));

      for (const item of objects) {
        const p = worldToScreen(item.o.x, item.o.y);
        if (p.x < -70 || p.x > W + 70 || p.y < -100 || p.y > H + 60) continue;

        if (item.type === "tree") drawTree(item.o);
        if (item.type === "rock") drawRock(item.o);
        if (item.type === "chest") drawChest(item.o);
        if (item.type === "wall") drawWall(item.o);
        if (item.type === "enemy") drawEnemy(item.o);
        if (item.type === "loot") drawLoot(item.o);
      }

      drawPets();
      drawPlayer();
      drawHUD();
    }

    function updateUI() {
      $("health").textContent = "❤️ " + Math.ceil(hp) + "/100";
      $("wood").textContent = "🪵 " + wood;
      $("stone").textContent = "🪨 " + stone;
      $("coins").textContent = "🪙 " + coins;
      $("level").textContent = "⭐ Level " + level + " (" + xp + " XP)";
      $("pets").textContent = "🐾 " + petList.length + " pets";

      const petPower = petList.reduce((sum, p) => sum + p.power, 0);
      $("inventory").textContent = "🎒 Wood: " + wood + " | Stone: " + stone +
        " | Coins: " + coins + " | Pet power: +" + petPower + " damage";
    }

    function closest(list, maxDist = 2.2) {
      let best = null;
      let bestDist = maxDist;

      for (const o of list) {
        const d = distance(player, o);
        if (d < bestDist) {
          best = o;
          bestDist = d;
        }
      }
      return best;
    }

    function move(dx, dy) {
      if (dead) return;
      player.x += dx;
      player.y += dy;
      player.x = clamp(player.x, -100, 100);
      player.y = clamp(player.y, -100, 100);
      updateUI();
    }

    function mine() {
      if (dead) return;

      let o = closest(trees, 2.5);
      if (o) {
        o.hp--;
        wood += 3;
        if (o.hp <= 0) {
          trees.splice(trees.indexOf(o), 1);
          wood += 5;
          say("🌳 Tree chopped! You collected 8 wood.");
        } else {
          say("🪵 Chopping tree... +3 wood.");
        }
        updateUI(); return;
      }

      o = closest(rocks, 2.5);
      if (o) {
        o.hp--;
        stone += 3;
        if (o.hp <= 0) {
          rocks.splice(rocks.indexOf(o), 1);
          stone += 5;
          say("⛏️ Rock mined! You collected 8 stone.");
        } else {
          say("🪨 Mining rock... +3 stone.");
        }
        updateUI(); return;
      }

      say("Move next to a tree or rock first!");
    }

    function build() {
      if (dead) return;
      if (wood < 5) {
        say("You need 5 wood to build a wall!");
        return;
      }
      wood -= 5;
      walls.push(make(Math.round(player.x + 1), Math.round(player.y), {}));
      say("🧱 Wall built!");
      updateUI();
    }

    function attack() {
      if (dead) return;
      let e = closest(enemies, 3.2);

      if (!e) {
        say("Get closer to an enemy!");
        return;
      }

      const petPower = petList.reduce((sum, p) => sum + p.power, 0);
      e.hp -= damage + petPower;

      if (e.hp <= 0) {
        enemies.splice(enemies.indexOf(e), 1);
        const boss = e.type === "boss";
        coins += boss ? 100 : 10;
        xp += boss ? 100 : 20;
        loot.push(make(e.x, e.y, { rarity: boss ? "Legendary" : rarity() }));

        if (xp >= level * 100) {
          xp -= level * 100;
          level++;
          damage += 5;
          hp = Math.min(100, hp + 20);
          say("⭐ LEVEL UP! You deal more damage!");
        } else {
          say(boss ? "🏆 BOSS DEFEATED! +100 coins!" : "👾 Enemy defeated! +10 coins!");
        }

        if (!boss && enemies.filter(enemy => enemy.type === "enemy").length < 8) {
          spawnEnemy(false);
        }
      } else {
        say("⚔️ Hit! Enemy health: " + Math.ceil(e.hp) + "/" + e.maxHp);
      }

      updateUI();
    }

    function openChest() {
      if (dead) return;
      let o = closest(chests, 2.7);

      if (!o) {
        if (coins < 20) {
          say("Find a nearby chest or collect 20 coins to buy a loot chest!");
          return;
        }
        coins -= 20;
        o = { rarity: rarity() };
      } else {
        chests.splice(chests.indexOf(o), 1);
      }

      const rewards = { Common: 10, Rare: 25, Epic: 60, Legendary: 150 };
      const reward = rewards[o.rarity] || 10;
      coins += reward;

      if (o.rarity === "Legendary") {
        damage += 10;
        say("🌟 LEGENDARY LOOT! +150 coins and +10 attack damage!");
      } else {
        say("🎁 " + o.rarity + " treasure! +" + reward + " coins!");
      }

      updateUI();
    }

    function hatchPet() {
      if (dead) return;
      if (coins < 50) {
        say("You need 50 coins for a pet egg!");
        return;
      }
      coins -= 50;

      const n = Math.random();
      let pet;

      if (n < 0.4) pet = { name: "Slime", emoji: "🟢", power: 3 };
      else if (n < 0.7) pet = { name: "Wolf", emoji: "🐺", power: 6 };
      else if (n < 0.9) pet = { name: "Dragon", emoji: "🐉", power: 12 };
      else if (n < 0.98) pet = { name: "Phoenix", emoji: "🔥", power: 20 };
      else pet = { name: "Cosmic Dragon", emoji: "🌌", power: 40 };

      petList.push(pet);
      say("🥚 You hatched " + pet.emoji + " " + pet.name + "! Your pets boost attack.");
      updateUI();
    }

    function heal() {
      if (dead) return;
      if (coins < 20) {
        say("You need 20 coins to heal!");
        return;
      }
      if (hp >= 100) {
        say("Your health is already full!");
        return;
      }
      coins -= 20;
      hp = Math.min(100, hp + 35);
      say("❤️ Restored 35 health!");
      updateUI();
    }

    function spawnEnemy(isBoss) {
      let x = player.x + randint(-15, 15);
      let y = player.y + randint(-15, 15);

      if (Math.hypot(x - player.x, y - player.y) < 6) {
        x += 8;
      }

      enemies.push(make(x, y, {
        type: isBoss ? "boss" : "enemy",
        hp: isBoss ? 300 : 50,
        maxHp: isBoss ? 300 : 50,
        damage: isBoss ? 12 : 4,
        cooldown: 0
      }));
    }

    function summonBoss() {
      if (dead) return;
      if (enemies.some(e => e.type === "boss")) {
        say("The Shadow Boss is already in the world!");
        return;
      }
      spawnEnemy(true);
      say("👹 THE SHADOW BOSS HAS ARRIVED!");
    }

    function secretPortal() {
      if (dead) return;
      player.x += randint(-25, 25);
      player.y += randint(-25, 25);

      for (let i = 0; i < 7; i++) {
        chests.push(make(
          Math.round(player.x + randint(-5, 5)),
          Math.round(player.y + randint(-5, 5)),
          { rarity: rarity() }
        ));
      }

      say("🌀 Secret region discovered! Seven treasure chests appeared.");
      updateUI();
    }

    function saveGame() {
      try {
        const data = {
          player, trees, rocks, chests, enemies, walls, loot, petList,
          wood, stone, coins, hp, xp, level, damage, dead
        };
        localStorage.setItem("ultimateSurvival3DSave", JSON.stringify(data));
        say("💾 Game saved on this device!");
      } catch (e) {
        say("Saving isn't available in this browser. Try opening the game in Safari.");
      }
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem("ultimateSurvival3DSave");
        if (!raw) {
          say("No saved game found. Play a little, then press Save.");
          return;
        }

        const s = JSON.parse(raw);
        if (!s.player || !Array.isArray(s.trees) || !Array.isArray(s.enemies)) {
          say("That save is invalid.");
          return;
        }

        Object.assign(window, {
          player: s.player,
          trees: s.trees,
          rocks: s.rocks,
          chests: s.chests,
          enemies: s.enemies,
          walls: s.walls,
          loot: s.loot,
          petList: s.petList,
          wood: s.wood,
          stone: s.stone,
          coins: s.coins,
          hp: s.hp,
          xp: s.xp,
          level: s.level,
          damage: s.damage,
          dead: s.dead
        });

        updateUI();
        say("📂 Saved game loaded!");
      } catch (e) {
        say("Could not load the save in this browser.");
      }
    }

    function restartGame() {
      if (confirm("Start a new adventure? Your current progress will be replaced.")) {
        resetGame();
      }
    }

    function update(dt) {
      if (dead) return;

      gameTime += dt;
      player.attackCooldown = Math.max(0, player.attackCooldown - dt);

      for (const e of enemies) {
        const d = distance(e, player);

        if (d > 1.2) {
          const speed = e.type === "boss" ? 0.65 : 0.45;
          e.x += (player.x - e.x) / Math.max(d, 0.01) * speed * dt;
          e.y += (player.y - e.y) / Math.max(d, 0.01) * speed * dt;
        } else {
          e.cooldown -= dt;
          if (e.cooldown <= 0) {
            hp -= e.damage;
            e.cooldown = e.type === "boss" ? 1.1 : 1.5;
            if (hp <= 0) {
              hp = 0;
              dead = true;
              say("💀 You were defeated! Press Restart to play again.");
            }
          }
        }
      }

      spawnClock += dt;
      if (spawnClock > 18 && enemies.filter(e => e.type === "enemy").length < 12) {
        spawnEnemy(false);
        spawnClock = 0;
      }

      if (messageTimer > 0) {
        messageTimer -= dt;
        if (messageTimer <= 0) {
          $("message").textContent = "Explore the world and keep surviving.";
        }
      }

      updateUI();
    }

    function loop(time) {
      const dt = Math.min((time - lastTime) / 1000 || 0, 0.05);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();

      if (k === "arrowup" || k === "w") move(0, -1);
      if (k === "arrowdown" || k === "s") move(0, 1);
      if (k === "arrowleft" || k === "a") move(-1, 0);
      if (k === "arrowright" || k === "d") move(1, 0);
      if (k === "e") mine();
      if (k === "f") attack();
    }, { passive: false });

    canvas.addEventListener("pointerdown", e => {
      if (dead) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * W;
      const y = (e.clientY - rect.top) / rect.height * H;
      const dx = x - W / 2;
      const dy = y - H / 2;

      if (Math.abs(dx) + Math.abs(dy) < 35) return;

      const wx = dx / 22 + dy / 11;
      const wy = dy / 11 - dx / 22;

      if (Math.abs(wx) > Math.abs(wy)) {
        move(wx > 0 ? 1 : -1, 0);
      } else {
        move(0, wy > 0 ? 1 : -1);
      }
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
